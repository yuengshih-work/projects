<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2833">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>下包廠商專區｜平安住</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="vendor.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="firm">平安住股份有限公司・下包廠商專區</div>
    <h1 id="caseName">讀取中…</h1>
    <div class="addr" id="caseAddr"></div>
    <div class="who" id="who"></div>
  </div>
</header>

<main class="wrap">
  <div id="sysNote" class="note" style="display:none"></div>
  <div id="gone" class="empty" style="margin-top:24px;display:none"></div>

  <div id="pages">
  <!-- 我的工作 -->
  <section class="pg on" id="pg-mine">
    <div id="hotNotes"></div>
    <h3 style="margin-top:6px">我的工項</h3>
    <div id="myTasks"></div>
    <div id="contacts"></div>
  </section>

  <!-- 整體進度 -->
  <section class="pg" id="pg-all">
    <h2>整體進度</h2>
    <p class="lead">全案各工種的大略時程，方便和其他廠商配合。日期以平安住現場安排為準。</p>
    <div class="kpis">
      <div class="kpi"><div class="k">整體完成</div><div class="v" id="kPct">—</div></div>
      <div class="kpi"><div class="k">施工中工項</div><div class="v" id="kNow">—</div></div>
    </div>
    <div class="pbar"><b id="pbar"></b></div>

    <div id="modelBox"></div>

    <h3>本週與接下來兩週</h3>
    <div id="soon"></div>
    <h3>全案時程</h3>
    <div id="allTasks"></div>
  </section>

  <!-- 注意事項 -->
  <section class="pg" id="pg-notes">
    <h2>注意事項</h2>
    <p class="lead">進場前請先看過；有更新會標示日期。</p>
    <div id="noteList"></div>
  </section>

  <!-- 照片 -->
  <section class="pg" id="pg-photos">
    <h2>上傳照片</h2>
    <p class="lead">施工中、完工、或現場有問題都可以拍照上傳，平安住會收到。</p>
    <div class="card">
      <form class="f" id="upForm">
        <label>工項<select name="task"></select></label>
        <label>說明（選填）<input name="caption" placeholder="例：2F 冷熱水管配置完成、試水中"></label>
        <label>照片（可多選）<input type="file" name="files" accept="image/*" multiple required></label>
        <div class="newprev" id="np"></div>
        <label class="ck"><input type="checkbox" name="done">這是完工照片，通知平安住安排驗收</label>
        <button class="btn acc" type="submit">上傳</button>
      </form>
    </div>
    <h3>我上傳的照片</h3>
    <div id="myPhotos"></div>
  </section>

  <!-- 款項 -->
  <section class="pg" id="pg-money">
    <h2>款項與請款進度</h2>
    <p class="lead">只有貴公司看得到這一頁。</p>
    <div id="money"></div>
  </section>
  </div>

  <footer><span id="firm"></span></footer>
</main>

<nav class="bar" role="tablist" id="nav">
  <button data-p="mine" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M9 5h11M9 12h11M9 19h11"/><path d="M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/></svg>我的工作</button>
  <button data-p="all" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>整體進度</button>
  <button data-p="notes" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>注意事項</button>
  <button data-p="photos" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="3.5"/></svg>照片</button>
  <button data-p="money" aria-selected="false" id="navMoney" style="display:none"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>款項</button>
</nav>

<div class="spin" id="spin"><div id="spinTxt">處理中…</div></div>

<script src="../assets/common.js"></script>
<script src="vendor.js"></script>
<script>
/* 網址：vendor/?t=專屬代碼 */
const TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();
let D = null;
$('#firm').textContent = FIRM;

/* ---------- nav ---------- */
const PAGES = ['mine', 'all', 'notes', 'photos', 'money'];
$$('nav.bar button').forEach(b => b.onclick = () => go(b.dataset.p));
function go(p) {
  if (!PAGES.includes(p) || (p === 'money' && !(D && D.me.showMoney))) p = 'mine';
  $$('nav.bar button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === p));
  $$('section.pg').forEach(s => s.classList.toggle('on', s.id === 'pg-' + p)); window.scrollTo(0, 0);
  history.replaceState(null, '', location.search + '#' + p);
}

/* ---------- 我的工作 ---------- */
function taskCard(t, withBtn) {
  const r = readiness(t, D.tasks);
  return `<div class="card task ${t.status === '已完成' ? 'isdone' : ''}">
    <div class="th"><div><div class="tt">${esc(t.title)}</div><div class="small muted">${esc(t.area || '')}${t.area ? '・' : ''}${esc(range(t))}</div></div>${statusPill(t.status)}</div>
    ${r ? `<div class="ready ${r.cls}">${esc(r.text)}</div>` : ''}
    ${t.note ? `<div class="tnote">${esc(t.note)}</div>` : ''}
    ${withBtn && t.status !== '已完成' ? `<button class="btn ghost sm" data-up="${esc(t.id)}">上傳這個工項的照片</button>` : ''}
  </div>`;
}
function renderMine() {
  const hot = D.notices.filter(n => n.important);
  $('#hotNotes').innerHTML = hot.length ? `<div class="card hot"><b>重要注意事項</b>${hot.map(n => `<div class="hn"><div class="ht">${esc(n.title)}</div>${n.body ? `<div class="hb">${esc(n.body)}</div>` : ''}</div>`).join('')}
    <button class="link" onclick="go('notes')">查看全部注意事項（${D.notices.length}）</button></div>` : '';
  const mine = D.tasks.filter(t => t.mine);
  const open = mine.filter(t => t.status !== '已完成'), done = mine.filter(t => t.status === '已完成');
  $('#myTasks').innerHTML = mine.length ? open.map(t => taskCard(t, true)).join('') +
    (done.length ? `<details class="donebox"><summary>已完成的工項（${done.length}）</summary>${done.map(t => taskCard(t)).join('')}</details>` : '')
    : '<div class="empty">平安住還沒有排定貴公司的工項</div>';
  $$('#myTasks [data-up]').forEach(b => b.onclick = () => { go('photos'); $('#upForm [name=task]').value = b.dataset.up; });
  const ct = String(D.vp.contacts || '').trim();
  $('#contacts').innerHTML = ct ? `<h3>現場聯絡窗口</h3><div class="card contact">${linkify(ct)}</div>` : '';
}

/* ---------- 整體進度 ---------- */
function renderAll() {
  const ts = D.tasks, done = ts.filter(t => t.status === '已完成').length;
  const pct = ts.length ? Math.round(done / ts.length * 100) : 0;
  $('#kPct').innerHTML = ts.length ? `${pct}%<span class="sub">${done}／${ts.length} 個工項完成</span>` : '—';
  const now = ts.filter(t => t.status === '施工中' || t.status === '待驗收');
  $('#kNow').innerHTML = now.length ? `${now.length} 項<span class="sub">${esc([...new Set(now.map(t => t.trade || t.vendor))].join('、'))}</span>` : '無';
  $('#pbar').style.width = pct + '%';
  renderModel($('#modelBox'), D.vp);

  const soon = upcoming(ts, 21);
  $('#soon').innerHTML = soon.length ? `<div class="card">${soon.map(rowHtml).join('')}</div>` : '<div class="empty">這三週沒有排定的工項</div>';
  $('#allTasks').innerHTML = ts.length ? byMonth(ts).map(g => `<div class="mhd">${esc(g.label)}</div><div class="card">${g.items.map(rowHtml).join('')}</div>`).join('') : '<div class="empty">尚未排定時程</div>';
}
function rowHtml(t) {
  return `<div class="trow ${t.mine ? 'mine' : ''}" data-s="${esc(t.status)}">
    <div class="td">${esc(range(t, true))}</div>
    <div class="tm"><div><span class="trade">${esc(t.trade || t.vendor || '未指定')}</span>${t.mine ? '<span class="pill solid" style="margin-left:6px">貴公司</span>' : ''}</div>
      <div class="ti">${esc(t.title)}${t.area ? `<span class="muted">・${esc(t.area)}</span>` : ''}</div></div>
    <div class="ts">${statusPill(t.status)}</div></div>`;
}

/* ---------- 注意事項 ---------- */
function renderNotes() {
  const list = [...D.notices].sort((a, b) => (b.important - a.important) || (+a.sort || 0) - (+b.sort || 0) || String(b.updatedAt).localeCompare(String(a.updatedAt)));
  $('#noteList').innerHTML = list.length ? list.map(n => `<div class="card note2 ${n.important ? 'imp' : ''}">
    <div class="nh"><b>${n.important ? '<span class="pill solid">重要</span> ' : ''}${esc(n.title)}</b><span class="tiny muted">${esc(rocS(n.updatedAt))} 更新</span></div>
    ${n.body ? `<div class="nb">${linkify(n.body)}</div>` : ''}</div>`).join('') : '<div class="empty">目前沒有注意事項</div>';
}

/* ---------- 照片 ---------- */
function renderPhotos() {
  const mine = D.tasks.filter(t => t.mine);
  const sel = $('#upForm [name=task]'), cur = sel.value;
  sel.innerHTML = mine.map(t => `<option value="${esc(t.id)}">${esc(t.title)}${t.area ? '・' + esc(t.area) : ''}</option>`).join('') + '<option value="">其他／現場狀況</option>';
  if (cur !== '' && [...sel.options].some(o => o.value === cur)) sel.value = cur;
  const tName = id => { const t = D.tasks.find(x => x.id === id); return t ? t.title : '其他／現場狀況'; };
  const ps = [...D.photos].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  const groups = [...new Set(ps.map(p => p.taskId))];
  $('#myPhotos').innerHTML = ps.length ? groups.map(g => { const l = ps.filter(p => p.taskId === g); return `<div class="floorhd">${esc(tName(g))}　<span class="muted small">${l.length} 張</span></div>
    <div class="grid">${l.map(p => `<div class="ph"><a href="${img(p.fileId, 2400)}" target="_blank" rel="noopener"><img src="${img(p.fileId, 700)}" loading="lazy" alt=""></a>
      <div class="t">${esc(rocS(p.createdAt))}${p.caption ? '　' + esc(p.caption) : ''}</div><button class="x" data-dp="${esc(p.id)}">刪除</button></div>`).join('')}</div>`; }).join('')
    : '<div class="empty">還沒有上傳照片</div>';
  $$('#myPhotos [data-dp]').forEach(b => b.onclick = async e => {
    e.preventDefault(); if (!confirm('刪除這張照片？')) return;
    busy(true, '刪除中…'); try { await vPost({ action: 'v_delete', id: b.dataset.dp }); await load(); } catch (err) { alert('刪除失敗：' + err.message); } busy(false);
  });
}
$('#upForm [name=files]').onchange = e => { $('#np').innerHTML = [...e.target.files].map(f => `<img src="${URL.createObjectURL(f)}" alt="">`).join(''); };
$('#upForm').onsubmit = async e => {
  e.preventDefault(); const f = e.target; const files = [...f.files.files]; if (!files.length) return alert('請選擇照片');
  const done = f.done.checked && f.task.value;
  if (f.done.checked && !f.task.value) return alert('回報完工請先選擇工項');
  let i = 0;
  try {
    for (const file of files) {
      i++; busy(true, `上傳照片 ${i}/${files.length}…`);
      await vPost({ action: 'v_upload', taskId: f.task.value, caption: f.caption.value.trim(), data: await shrink(file, 1600), done: done && i === files.length });
    }
    f.files.value = ''; f.caption.value = ''; f.done.checked = false; $('#np').innerHTML = '';
    await load(); alert(done ? '已上傳，並通知平安住安排驗收。' : '已上傳。');
  } catch (err) { alert(`上傳失敗（已完成 ${i - 1}/${files.length} 張）：` + err.message); }
  busy(false);
};

/* ---------- 款項 ---------- */
function renderMoney() {
  const m = D.me; $('#navMoney').style.display = m.showMoney ? '' : 'none';
  $('#nav').style.gridTemplateColumns = `repeat(${m.showMoney ? 5 : 4},1fr)`;
  if (!m.showMoney) return;
  const ps = m.pays || [], paid = ps.filter(p => p.paid).reduce((a, p) => a + (+p.amt || 0), 0);
  const sum = ps.reduce((a, p) => a + (+p.amt || 0), 0);
  $('#money').innerHTML = `<div class="kpis">
      <div class="kpi wide"><div class="k">發包金額</div><div class="v">${money(m.amount)}</div></div>
      <div class="kpi"><div class="k">已付款</div><div class="v" style="color:var(--ok)">${money(paid)}</div></div>
      <div class="kpi"><div class="k">未付款</div><div class="v">${money((m.amount || sum) - paid)}</div></div></div>
    <div class="card">${ps.length ? ps.map(p => `<div class="payi"><div class="hd"><div><b>${esc(p.p || '')}</b><div class="c">${esc(p.c || '')}</div>${payPill(p)}</div>
      <div class="a">${money(p.amt)}</div></div>
      ${p.req || p.paid ? `<div class="small muted">${p.req ? '請款 ' + esc(roc(p.req)) : ''}${p.req && p.paid ? '　' : ''}${p.paid ? '付款 ' + esc(roc(p.paid)) : ''}</div>` : ''}</div>`).join('')
      : '<div class="small muted">尚未設定請款期別</div>'}</div>
    <p class="small muted">請款請依合約約定開立發票並附驗收紀錄；有疑問請聯絡平安住。</p>`;
}

/* ---------- 讀取 ---------- */
const vPost = (body, limit = 60000) => fetchJ(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, t: TOKEN }) }, limit);
async function load() {
  const j = await fetchJ(API + '?' + new URLSearchParams({ action: 'vendor', t: TOKEN }));
  D = { ...j, vp: j.vp || {} };
  document.title = `${j.case.name}｜下包廠商專區`;
  $('#caseName').textContent = j.case.name; $('#caseAddr').textContent = j.case.address || '';
  $('#who').textContent = `${j.me.name}${j.me.trade ? '（' + j.me.trade + '）' : ''}`;
  renderMine(); renderAll(); renderNotes(); renderPhotos(); renderMoney();
}
function fail(msg) {
  $('#caseName').textContent = '無法開啟'; $('#pages').style.display = 'none'; $('#nav').style.display = 'none';
  const g = $('#gone'); g.style.display = 'block'; g.textContent = msg;
}
if (!TOKEN) fail('網址不完整，請使用平安住傳給您的完整連結。');
else if (!configured()) fail('系統尚未完成設定。');
else {
  busy(true, '讀取中…');
  load().then(() => go(location.hash.slice(1) || 'mine'))
    .catch(err => /連結/.test(err.message) ? fail(err.message) : (($('#sysNote').style.display = 'block'), ($('#sysNote').textContent = '資料讀取失敗：' + err.message)))
    .finally(() => busy(false));
}
</script>
</body>
</html>
