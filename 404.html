<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>平安住・工程專案頁</title>
<script>
/* 短網址：/projects/案場代號 → /projects/site/?id=案場代號 */
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var i = parts.indexOf('projects');
  var id = i >= 0 ? parts[i + 1] : '';
  if (id && /^[a-z0-9][a-z0-9-]{1,30}$/i.test(id) && id !== 'site' && id !== 'assets') {
    location.replace('/' + parts.slice(0, i + 1).join('/') + '/site/?id=' + encodeURIComponent(id.toLowerCase()) + location.hash);
  }
})();
</script>
<style>body{margin:0;background:#F6F2EA;color:#1E2833;font:17px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:16px}</style>
