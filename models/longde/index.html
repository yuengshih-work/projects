  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.fl{min-width:44px;font-weight:600}
  .sep{width:1px;background:var(--line);margin:0 2px}
  .legend{position:fixed;left:16px;bottom:14px;z-index:5;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.7;color:var(--muted);max-width:380px}

  .lbl{font-size:13px;font-weight:600;color:#1f3d3a;background:rgba(255,255,255,.88);border:1px solid #cfc6b2;border-radius:6px;padding:2px 7px;white-space:nowrap;pointer-events:none}
  @media (max-width:900px){
    .legend{display:none}
    header{left:0;right:0;top:0;max-width:none;border-radius:0;border-width:0 0 1px;padding:8px 12px}
    header h1{font-size:15px} header p{font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #app{top:58px;bottom:92px}
    .panel{top:auto;bottom:0;left:0;right:0;max-width:none;border-radius:0;border-width:1px 0 0;padding:7px 10px;gap:6px}
    .panel .row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:1px}

  const geo=new THREE.ExtrudeGeometry(s,{depth:(z1-z0)*U,bevelEnabled:false}); geo.rotateX(Math.PI/2);
  const mesh=new THREE.Mesh(geo,[mat[m],mat.ext]); mesh.position.y=z1*U; mesh.receiveShadow=true; mesh.castShadow=true; g.add(mesh); return mesh;
}

// ---- 建各樓層 ----
const floorGroups=[], roofGroup=new THREE.Group(); scene.add(roofGroup);
const ground=new THREE.Group(); scene.add(ground);
box(ground,-20,1430,-20,555,-8,-2,'slab');
for(const fl of FLOORS){
  const g=new THREE.Group(); g.position.y=fl.z*U; g.userData.fl=fl; scene.add(g); floorGroups.push(g);
  if(fl.slab) slab(g,fl.slab,fl.holes,-15,0,'slab');
  for(const f of fl.floors||[]) box(g,f.r[0],f.r[1],f.r[2],f.r[3],f.z[0],f.z[1],f.m);
  for(const w of fl.walls) buildWall(fl,g,w);
  for(const c of fl.cols) box(g,c[0],c[1],c[2],c[3],fl.FL||0,fl.h,'col','wall');
  for(const e of fl.extra||[]){
    if(e.k==='flight') buildFlight(g,e);
    else if(e.k==='furn') furn(g,e,fl.FL);
    else if(e.k==='win') winPane(g,e.r[0],e.r[1],e.r[2],e.r[3],e.z[0],e.z[1]);
    else box(g,e.r[0],e.r[1],e.r[2],e.r[3],e.z[0],e.z[1],e.m,(e.m==='wall'||e.m==='glass'||e.m==='band')?'wall':(e.m==='stair'?'stair':''));
  }
  if(fl.roof){ const [a,b,c,d]=fl.roof; box(roofGroup,a,b,c,d,fl.z+fl.h-15,fl.z+fl.h,'roof'); }
  const lg=new THREE.Group(); g.add(lg); g.userData.labels=lg;
  for(const [t,x,y] of fl.labels){ const dv=document.createElement('div'); dv.className='lbl'; dv.textContent=t;
    const o=new CSS2DObject(dv); o.position.set(x*U,((fl.FL||0)+35)*U,y*U); lg.add(o); }
}

// ---- 外觀：米白橫帶、轉角柱、女兒牆壓頂（整棟模式）----
const facade=new THREE.Group(); scene.add(facade);
{ const P=6, BW=403;
  for(const fl of FLOORS.filter(f=>f.z>0)){
    const L=fl.slab[1], z=fl.z, zt=fl.id==='6F'?null:null;
    const Lr=fl.id==='6F'?844:L;
// 已取消線板     box(facade,-P,L+P,-P,0,z-25,z+35,'band'); box(facade,-P,L+P,BW,BW+P,z-25,z+35,'band');
// 已取消線板     box(facade,-P,0,-P,BW+P,z-25,z+35,'band'); box(facade,L,L+P,-P,BW+P,z-25,z+35,'band');
  }
  // 屋頂壓頂與露台女兒牆壓頂
  box(facade,-P,844+P,-P,BW+P,1880-15,1880+20,'band');
  box(facade,844,1396+P,-P,13.1,1580+100,1580+118,'band'); box(facade,844,1396+P,391,BW+P,1580+100,1580+118,'band');
  box(facade,1364,1396+P,-P,BW+P,1580+100,1580+118,'band');
  // 轉角柱（後側兩角到屋頂、前側兩角到露台女兒牆）
  const pil=(x0,x1,y0,y1,top)=>box(facade,x0,x1,y0,y1,380,top,'band');
  pil(-P,40,-P,0,1880); pil(-P,0,-P,40,1880); pil(-P,40,BW,BW+P,1880); pil(-P,0,BW-40,BW+P,1880);
  pil(1310,1396+P,-P,0,1698); pil(1310,1396+P,BW,BW+P,1698);
}
// 2F 側面：懸挑平台＋6台冷氣戶外機＋橫向格柵
{ const g2=floorGroups.find(g=>g.userData.fl.id==='2F'); const ag=new THREE.Group(); g2.add(ag);
  const X0=110, X1=640, Y0=403, Y1=468, H=150;
  box(ag,X0,X1,Y0,Y1,-12,0,'band','win');
  for(let i=0;i<5;i++){ const cx=X0+60+i*102;
    box(ag,cx-40,cx+40,Y0+12,Y0+42,2,62,'acu','win');
    const fan=new THREE.Mesh(new THREE.CylinderGeometry(22*U,22*U,1*U,24),mat.acfan); fan.rotation.x=Math.PI/2; fan.position.set((cx-8)*U,34*U,(Y0+42.5)*U); ag.add(fan);
    box(ag,cx-40,cx+40,Y0+5,Y0+12,40,44,'leg','win');
  }
  for(let z=4;z<=H;z+=9) box(ag,X0,X1,Y1-4,Y1,z,z+5,'grille','win');
  for(const x of[X0,X1-4]) box(ag,x,x+4,Y0,Y1,0,H+5,'grille','win');
  box(ag,X0,X1,Y0,Y1,H+5,H+9,'grille','win');
  for(let x=X0+100;x<X1-50;x+=155) box(ag,x,x+3,Y1-7,Y1-4,0,H+5,'grille','win');
}
// ---- 外觀配色 ----
const SCHEMES={
  A:{ext:0x8d9296, ext1:0x5e6266, band:0xffffff, bandEm:0xa8a8a8, frame:0x4a3b2e, grille:0x6b5644},   // 深灰仿石＋白色線板（參考圖2）
  B:{ext:0xd9cfbf, ext1:0x6e6359, band:0x4d5054, bandEm:0x000000, frame:0x2b2b2b, grille:0x8a6a4c}    // 暖米白仿石＋深灰線板＋黑框
};
let sch='A';
function applyScheme(k){sch=k; const s=SCHEMES[k]; for(const n of['ext','ext1','band','frame','grille']) mat[n].color.setHex(s[n]); mat.band.emissive.setHex(s.bandEm);
  document.querySelectorAll('[data-sch]').forEach(b=>b.classList.toggle('on',b.dataset.sch===k));}
document.querySelectorAll('[data-sch]').forEach(b=>b.onclick=()=>applyScheme(b.dataset.sch));
applyScheme('A');
// ---- 狀態 ----
let cur='1F', cut=true, showLbl=true, view='persp';
const CUTH=105;
function apply(){
  const whole=cur==='ALL';
  floorGroups.forEach(g=>{
    const on=whole||g.userData.fl.id===cur; g.visible=on;
    const doCut=cut&&!whole;
    g.traverse(m=>{ if(!m.isMesh||m.userData.tag!=='wall') return;
      const {z0,z1}=m.userData; const fl=g.userData.fl; const lim=(fl.FL||0)+CUTH;
      if(!doCut){m.visible=true;m.scale.y=1;return;}
      if(z0>=lim){m.visible=false;return;} m.visible=true; m.scale.y=Math.min(1,(lim-z0)/(z1-z0)); });
    // 樓梯在剖切時只保留本層可見高度以內
    g.traverse(m=>{ if(m.isMesh&&m.userData.tag==='stair') m.visible=!(cut&&!whole&&m.userData.z0>(g.userData.fl.FL||0)+CUTH); });
    g.userData.labels.visible=on&&showLbl&&!whole;
    g.userData.labels.children.forEach(o=>{o.visible=on&&showLbl&&!whole; if(!o.visible) o.element.style.display='none';});
  });
  roofGroup.visible=whole; facade.visible=whole;
  ground.visible=whole||cur==='1F';
  const fl=FLOORS.find(f=>f.id===cur);
  document.getElementById('ttl').textContent=whole?'龍德路｜整棟 1F～6F 3D示意':`龍德路 ${cur}｜空間配置3D示意`;
  document.getElementById('sub').textContent=(whole?'各樓層疊合（樓高 2F 以上以 300cm 計）':`依 ${fl.src} 建模（1:50 實際尺寸）`)+'・拖曳旋轉、雙指／滾輪縮放';
  document.getElementById('tCut').style.display=whole?'none':'';
  document.getElementById('tLbl').style.display=whole?'none':'';
  setView(view);
}
function setView(k){
  view=k; const whole=cur==='ALL'; const fl=FLOORS.find(f=>f.id===cur);
  const zc=whole?9.5:(fl.z/100+0.6); const port=camera.aspect<1;
  const tx=6.9, tz=2.0;
  let p,t=[tx,whole?zc:zc-0.4,tz];
  if(whole){
    t=[tx,8.5,tz];
    if(k==='persp') p=port?[tx-22,24,tz+20]:[tx-20,22,tz+32];
    if(k==='top') p=port?[tx-0.01,46,tz]:[tx,34,tz+0.01];
    if(k==='front') p=port?[tx+34,10,tz+9]:[tx+38,9.5,tz+13];
  }else{
    if(k==='persp') p=port?[tx-14,zc+16,tz+8]:[tx-5,zc+13,tz+10];
    if(k==='top') p=port?[tx-0.01,zc+19,tz]:[tx,zc+16,tz+0.01];
    if(k==='front') p=port?[tx+19,zc+4,tz+0.3]:[tx+15,zc+3,tz+0.3];
  }
  camera.position.set(...p); controls.target.set(...t); controls.update();
  sun.position.set(tx-3,zc+14,tz-6); sun.target.position.set(tx,zc-1,tz);
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===k));
}
const row=document.getElementById('floorRow');
[...FLOORS.map(f=>f.id),'ALL'].forEach(id=>{const b=document.createElement('button'); b.className='fl'+(id===cur?' on':''); b.textContent=id==='ALL'?'整棟':id;
  b.onclick=()=>{cur=id; row.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); apply();}; row.appendChild(b);});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
const tg=(id,fn)=>{const b=document.getElementById(id);b.onclick=()=>{b.classList.toggle('on');fn(b.classList.contains('on'));apply();};};
tg('tCut',v=>cut=v); tg('tLbl',v=>showLbl=v);
apply();
addEventListener('resize',()=>{camera.aspect=W()/H();camera.updateProjectionMatrix();renderer.setSize(W(),H());lr.setSize(W(),H());setView(view);});
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);lr.render(scene,camera);})();
</script>
